<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Triangle | Jezrel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            color: #4f4f4f;
            background-color: #ccefff;
            background-image:
                radial-gradient(circle, #f7b6d9 6px, transparent 7px),
                radial-gradient(circle, #fff2a8 6px, transparent 7px),
                radial-gradient(circle, #c9e9b7 6px, transparent 7px);
            background-size: 90px 90px;
            background-position: 0 0, 30px 30px, 60px 60px;
            overflow-x: hidden;
        }

        nav {
            position: relative;
            z-index: 2;
            padding: 15px 0;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #9edbf0;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 45px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        nav a {
            color: #55bfe5;
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.25s;
        }

        nav a:hover,
        nav a:focus-visible {
            color: #e85da8;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(90%, 760px);
            margin: 0 auto;
            padding: 60px 0 75px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #65b957;
            font-family: 'Fredoka', sans-serif;
            font-size: 50px;
            font-weight: 700;
            text-shadow: 2px 3px 0 rgba(190, 145, 25, 0.25);
        }

        .intro {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 5px 14px rgba(100, 170, 200, 0.18);
            font-size: 17px;
            font-weight: 500;
            line-height: 1.5;
        }

        .calculator {
            width: min(100%, 430px);
            margin: 42px auto 0;
            padding: 32px;
            border: 3px solid #ec83ad;
            border-radius: 24px;
            background: #f8c8db;
            box-shadow: 0 8px 20px rgba(80, 150, 180, 0.18);
            text-align: left;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
        }

        input[type="number"] {
            width: 100%;
            min-height: 48px;
            padding: 10px 13px;
            border: 2px solid #e99abb;
            border-radius: 10px;
            background: #fff;
            color: #4f4f4f;
            font: inherit;
        }

        input[type="number"]:focus-visible {
            outline: 3px solid #55bfe5;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: #65b957;
            box-shadow: 0 4px 0 #4d9d43;
            color: #fff;
            cursor: pointer;
            font: 600 17px 'Fredoka', sans-serif;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #55a94a;
        }

        .result {
            margin: 22px 0 0;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
            font-weight: 600;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            nav ul {
                gap: 18px;
            }

            nav a {
                font-size: 14px;
            }

            main {
                width: 88%;
                padding-top: 40px;
            }

            h1 {
                font-size: 40px;
            }

            .intro {
                padding: 11px 18px;
                font-size: 15px;
            }

            .calculator {
                padding: 24px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <nav aria-label="Main navigation">
        <ul>
            <li><a href="/">HOME</a></li>
            <li><a href="/profile">PROFILE</a></li>
            <li><a href="/works">WORKS</a></li>
            <li><a href="/contact">CONTACTS</a></li>
        </ul>
    </nav>

    <main>
        <div class="page-motifs" aria-hidden="true">
            <span class="motif-spiral">꩜</span>
            <span class="motif-star">✦</span>
            <span class="motif-flower">🌸</span>
        </div>
        <h1>AREA OF A TRIANGLE</h1>
        <p class="intro">Enter the base and height to calculate the area.</p>

        <section class="calculator" aria-label="Triangle area calculator">
            <form action="/works/area/triangle" method="post">
                <div class="input-group">
                    <label for="base">Base</label>
                    <input type="number" id="base" name="base" step="any" required>
                </div>

                <div class="input-group">
                    <label for="height">Height</label>
                    <input type="number" id="height" name="height" step="any" required>
                </div>

                <button type="submit">Calculate area</button>
            </form>

            {% if result is not none %}
            <p class="result" role="status">Area of the triangle: {{ result }}</p>
            {% endif %}
        </section>

        <a class="back-link" href="/works">Back to My Works</a>
    </main>
</body>
</html>
